name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nvidia: [true, false]
        postprocessing: [true, false]
        mqtt: [true, false]
        benchmark: [true, false]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: 'pip'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install the package
        run: |
          # Append optional groups based on matrix booleans
          DEPS=""
          if [ "${{ matrix.nvidia }}" == "true" ]; then DEPS="$DEPS,nvidia"; fi
          if [ "${{ matrix.postprocessing }}" == "true" ]; then DEPS="$DEPS,postprocessing"; fi
          if [ "${{ matrix.mqtt }}" == "true" ]; then DEPS="$DEPS,mqtt"; fi
          if [ "${{ matrix.benchmark }}" == "true" ]; then DEPS="$DEPS,benchmark"; fi

          # Remove leading comma if any
          DEPS="${DEPS#,}"

          # Put groups inside brackets
          if [ -n "$DEPS" ]; then
            DEPS="[$DEPS]"
          fi
          
          python -m pip install ".$DEPS"

      - name: Run tests
        run: |
          python -m pip install pytest pytest-asyncio numpy
          python -m pytest

      - name: Run benchmarks
        if: matrix.benchmark == 'true'
        run: |
          wattameter_benchmark_dt
          wattameter_benchmark_overhead
